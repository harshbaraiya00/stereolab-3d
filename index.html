/* Harsh signature: sharp lettering, orbital linework and restrained sheen. */
.hb-mark{width:36px;height:36px;flex:none;overflow:visible}
.hb-frame{fill:#162b3b;stroke:#75b9dd;stroke-width:1}
.hb-orbit{transform-origin:24px 24px;animation:hb-orbit 24s linear infinite}
.hb-orbit>circle:first-child{fill:none;stroke:#8bc8e8;stroke-width:.7;stroke-dasharray:17 13;opacity:.65}
.hb-beacon{fill:#efa86c;stroke:#111e2a;stroke-width:1}
.hb-mark text{font:600 14px Inter,"Segoe UI",sans-serif;letter-spacing:-.7px;fill:#d7eaf6}
.signature-inline{display:flex;align-items:center;gap:10px}.signature-inline .hb-mark{width:32px;height:32px}
.credit strong{font-size:11px;color:#b7d9ec;font-weight:600;letter-spacing:.25px}

.edition-copy{min-width:0}.edition-copy>span{display:block;font-size:9px;font-weight:600;letter-spacing:1.7px;color:var(--orange)}
.edition-copy p{font-size:11px;line-height:1.6;color:#9ab7ca;margin:3px 0 0}.edition-copy strong{font-weight:600;color:#d3e8f5}
.motion-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:7px;flex:none;padding:7px 10px;border:1px solid #35566b;background:#182c3c;color:#b5d7ea;font-size:10px;white-space:nowrap}

.motion-toggle[aria-pressed="false"] i{background:#8198a8}.motion-toggle:hover{border-color:#91bed6}.motion-toggle:disabled{opacity:.7}
.creator-footer{display:flex;align-items:center;gap:12px;border-top:1px solid #334c5e;padding:22px 0 4px;margin-top:28px}
.creator-footer>div>span{display:block;font-size:9px;color:#849eb0;letter-spacing:.5px}.creator-footer strong{display:block;color:#bddff2;font-size:14px;font-weight:600;letter-spacing:.3px}
.creator-footer>small{margin-left:auto;color:#98b4c8;font-size:10px}
.brand-word{position:relative}.brand-word::after{content:"";height:1px;position:absolute;bottom:-4px;left:0;right:0;background:linear-gradient(90deg,transparent,#8bc8e8 40%,#efa86c 62%,transparent);transform-origin:left;animation:brand-datum 8.4s ease-in-out infinite}
.decode-target{position:relative}.decode-word{display:inline-block;white-space:nowrap}.decode-char{position:relative;display:inline-block}
.decode-source{opacity:1}.decode-glyph{display:none;position:absolute;inset:0;text-align:center;overflow:hidden;pointer-events:none;color:inherit}

.chart-lesson::after,.branch-card>summary::after,.primary-button::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;background:linear-gradient(115deg,transparent,rgba(139,200,232,.12),rgba(239,168,108,.08),transparent);transform:translateX(-230%) skewX(-18deg)}

 .chart-lesson:hover::after,.branch-card>summary:hover::after,.primary-button:hover::after{animation:card-sheen .7s ease-out both}
 .motion-off .chart-lesson:hover{transform:none}
}

  const incident=m.bonds.filter(b=>b.a===a.id||b.b===a.id),us=incident.map(b=>unit(V.sub(byId[b.a===a.id?b.b:b.a].p,a.p)));
  let dirs=[];
  if(!us.length)dirs=[0,1,2,3].map(i=>tetraDirection(i,1));
  else if(incident.some(b=>b.order===3))dirs=[V.scale(us[0],-1)];
  else if(incident.some(b=>b.order===2)){
   if(us.length===1){let side=unit(V.cross([0,0,1],us[0]));if(V.norm(side)<.1)side=perpendicular(us[0]);dirs=[V.add(V.scale(us[0],-.5),V.scale(side,Math.sqrt(3)/2)),V.add(V.scale(us[0],-.5),V.scale(side,-Math.sqrt(3)/2))];}
   else dirs=[unit(V.scale(V.add(us[0],us[1]),-1))];
  }else if(us.length===1){
   const u=us[0],p=perpendicular(u),q=unit(V.cross(u,p));
   for(let i=0;i<3;i++){const t=i*2*Math.PI/3;dirs.push(V.add(V.scale(u,-1/3),V.add(V.scale(p,Math.sqrt(8/9)*Math.cos(t)),V.scale(q,Math.sqrt(8/9)*Math.sin(t)))));}
  }else if(us.length===2){
   const dot=V.dot(us[0],us[1]),parallel=V.scale(V.add(us[0],us[1]),-1/(3*(1+dot))),normal=unit(V.cross(us[0],us[1])),s=Math.sqrt(Math.max(0,1-V.dot(parallel,parallel)));
   dirs=[V.add(parallel,V.scale(normal,s)),V.add(parallel,V.scale(normal,-s))];
  }else dirs=[unit(V.scale(us.reduce((s,u)=>V.add(s,u),[0,0,0]),-1))];
  const base=atoms.find(b=>b.id===a.id);base.implicitH=0;
  if(/^CH[234]$/.test(base.label)||base.label==='OH')base.label=a.e;
  for(let i=0;i<n;i++){const id='implicit-'+a.id+'-'+i,length=a.e==='O'?.96:1.09;atoms.push(atom(id,'H',V.add(a.p,V.scale(unit(dirs[i]),length))));bonds.push(bond(a.id,id));}
 }
 return {...m,atoms,bonds,note:'All H atoms are shown. Bond directions are idealised teaching geometry; these coordinates are not an experimental or energy-optimised structure.'};
}
function pairFor(mode,variant=0,angle=180) {
 if(mode==='primer')return [methaneModel()];
 if(mode==='chain')return [structures.pentane(),variant===1?structures.neopentane():structures.isopentane()];
 if(mode==='position')return [structures.propan1ol(),structures.propan2ol()];
 if(mode==='functional')return [structures.ethanol(),structures.ether()];
 if(mode==='metamer')return [structures.ether13(),structures.ether22()];
 if(mode==='ring')return [structures.propene(),structures.cyclopropane()];
 if(mode==='tautomer')return [structures.keto(),structures.enol()];
 if(mode==='ez')return [alkene(true),alkene(false)];
 if(mode==='conformer'||mode==='newman')return [conformer(angle,variant===1)];
 if(mode==='chair')return [chair(variant===1)];
 if(mode==='meso')return [dichlorobutane(variant===0?'meso':variant===1?'RR':'SS')];
 if(mode==='axial')return [allene(false),allene(true)];
 if(mode==='mirror'||mode==='optical')return [tetra(false),tetra(true)];
 if(mode==='fischer')return [fischerTetra(variant===1)];
 if(mode==='carbonyl')return [carbonylModel()];
 if(mode==='topicity')return [ethanolTopicModel()];
 return [tetra(variant===1)];
}
function validateModel(m) {
 const ids=new Set(m.atoms.map(a=>a.id)),errors=[];
 if(ids.size!==m.atoms.length)errors.push('Duplicate atom IDs');
 for(const a of m.atoms){
  if(!a.p.every(Number.isFinite))errors.push('Non-finite coordinate '+a.id);
  const used=m.bonds.filter(b=>b.a===a.id||b.b===a.id).reduce((s,b)=>s+b.order,0)+(a.implicitH||0);
  if(used!==elements[a.e].valence)errors.push('Valence '+a.id+': '+used);
 }
 for(const b of m.bonds)if(!ids.has(b.a)||!ids.has(b.b)||b.a===b.b)errors.push('Invalid bond');
 return errors;
}

const lessons=[
L('map','foundation','The isomerism map','Formula → connectivity → arrangement','Foundation','mirror',
'સૌપ્રથમ molecular formula સરખાવો. Formula સમાન હોય પછી atom કયા atom સાથે જોડાયેલો છે તે જુઓ. Connectivity જુદી હોય તો constitutional isomers; connectivity સમાન અને space માં arrangement જુદી હોય તો stereoisomers. માત્ર drawing ફેરવવાથી નવો isomer બનતો નથી.',
'An isomer question begins with identity, not appearance. Two drawings may be the same molecule viewed from different directions. Isomers have the same molecular formula but represent different chemical structures. A molecular formula counts atoms; it does not tell you their connectivity or their arrangement in space.',
'Use three checkpoints. First compare the formulas. Next trace the atom-to-atom connections and bond orders. If these differ, investigate constitutional isomerism. If they agree, inspect spatial arrangement and ask whether ordinary rotation, conformational change, or a configuration-changing process relates the drawings. Always distinguish changing your viewpoint from changing molecular geometry.',
'Ethanol and methoxymethane both have C2H6O but different connections: C–C–O versus C–O–C. They are constitutional isomers. (R)- and (S)-bromochlorofluoromethane have the same connections; their mirror-related configurations differ. Turning the R molecule on screen keeps it R.',
'Similar-looking drawings need not have the same formula. Conversely, a different orientation on paper does not by itself establish isomerism. Resonance contributors are descriptions of one electronic structure, not separate isomers.',
'Configuration describes an arrangement associated with stereogenic units; conformation describes spatial arrangements accessible through rotations about formally single bonds. Whether conformers can be isolated also depends on barriers and the observation timescale. Treat this map as a reasoning guide, rather than a promise that every classification has a simple mechanical test.',
'Does rotating an R molecule in your hand make it S?','No. Proper rotation preserves handedness. A different viewpoint can reverse a visible clockwise trace without changing the configuration.',
[[G+'S05983','IUPAC · Stereoisomerism'],[G+'E02069','IUPAC · Enantiomer']]),
L('chain','foundation','Chain isomerism','A different carbon skeleton','Foundation','chain',
'Carbon ની કુલ સંખ્યા સરખી રાખીને carbon skeleton બદલાય ત્યારે chain isomerism થાય. સીધી line ને વાંકી દોરવાથી branching બદલાતી નથી; carbon–carbon connections બદલાવા જોઈએ.',
'Chain isomers have the same molecular formula and different carbon skeletons. A skeleton is a network of carbon connections, not the shape of the line used to draw it. A bent pentane drawing is still pentane as long as its five carbons remain connected in one unbranched chain.',
'Construct skeletons systematically. Begin with the longest possible chain, then shorten it while distributing the remaining carbon atoms as branches. Reject duplicate networks arising from reversing the chain or renumbering equivalent positions. Finally restore hydrogen counts using normal valence and confirm the molecular formula.',
'C5H12 has three constitutional isomers: pentane, 2-methylbutane, and 2,2-dimethylpropane. In the lab, compare an unbranched chain with a branched skeleton. All contain five carbons, but the number of carbon neighbours at particular atoms differs.',
'A carbon written at the end of a zigzag is not automatically a different position. Chain reversal often generates the same structure. Also, a shorter line in a drawing does not mean a shorter carbon skeleton.',
'At a more advanced level, constitutional identity is a graph-isomorphism problem. Atom labels, bond orders, and equivalent positions matter; the chosen parent name is a naming convention, not the molecular identity itself. This explains why simply listing names can overcount structures.',
'Is CH3CH2CH2CH2CH3 different from CH3CH2CH2CH2CH3 drawn right-to-left?','No. The carbon graph is unchanged. It is the same pentane molecule.',
[['https://sathee.iitk.ac.in/ncert-books/neet-ncert-exemplar/ncert_c11_exemplar/organic_chemistry_some_basic_principles_and_techniques/','NCERT Exemplar · Structural isomers']]),
L('position','foundation','Position isomerism','Same framework, different location','Foundation','position',
'Carbon skeleton એક જ હોય પરંતુ functional group, substituent અથવા multiple bond નું સ્થાન બદલાય તો position isomerism. Number બદલાય એટલા માટે નવો compound થાય એવું નથી—symmetry પણ તપાસો.',
'Position isomers retain the same carbon skeleton and the same type of functional feature but locate that feature differently. The feature may be an –OH group, a halogen, or a multiple bond. Compare the actual attachment sites rather than only the written locants.',
'Identify equivalent positions first. In a symmetrical chain, numbering from the other end may describe the same molecule. Place the feature only at inequivalent sites, check valence, and confirm that no carbon–carbon connections were altered.',
'Propan-1-ol and propan-2-ol both have C3H8O and the same three-carbon framework. Their hydroxyl groups attach to a terminal carbon and the middle carbon respectively. In propane, carbon 1 and carbon 3 are equivalent, so propan-3-ol is not a new isomer.',
'Do not confuse position isomerism with stereoisomerism at one fixed attachment site. Two configurations of butan-2-ol still have the OH group attached to carbon 2.',
'For substituted rings, use molecular symmetry to identify equivalent positions before counting. An isomer may also admit more than one classroom description depending on the chosen classification scheme; the underlying connectivity comparison is the reliable statement.',
'How many distinct monochloro substitution positions does propane have?','Two: terminal and central. The two ends are equivalent by symmetry.'),
L('functional','foundation','Functional group isomerism','The same formula can do different chemistry','Foundation','functional',
'Molecular formula સમાન હોવા છતાં functional group બદલાય તો functional group isomers. Ethanol માં O અંતે –OH માં છે; methoxymethane માં O બે carbon વચ્ચે છે. તેથી properties અને reactions બદલાઈ શકે.',
'A functional group is a recurring bonding pattern that strongly influences chemical behaviour. Functional isomers share a molecular formula but belong to different functional classes. The same inventory of atoms can be connected as an alcohol or an ether, for example.',
'Write the formula including implicit hydrogens, inspect heteroatom connectivity, and identify bond orders. Then name the functional groups. Confirm that the proposed pair has exactly the same composition; similar names and similar molecular masses are insufficient.',
'Ethanol, CH3CH2OH, and methoxymethane, CH3OCH3, both have C2H6O. Ethanol contains an O–H bond and can donate a hydrogen bond; the ether does not contain an O–H bond. Another common pair is propanal and propanone, both C3H6O.',
'Not every aldehyde and ketone are isomers of each other. Their formulas must match. Also, a resonance form of an amide is not a functional isomer of the amide.',
'Functional classification helps predict broad reaction patterns, but it does not fully determine physical properties or reactivity. Molecular size, substitution, solvent, and intermolecular interactions also matter. Avoid universal boiling-point rules based on one functional-group label.',
'Are methanol and methoxymethane functional isomers?','No. CH4O and C2H6O have different molecular formulas.'),
L('metamer','foundation','Metamerism','Redistributing carbon around a linking group','Foundation','metamer',
'Metamerism માં functional group નો પ્રકાર એ જ રહે છે, પરંતુ તેની બંને બાજુ alkyl groups માં carbon નું distribution બદલાય છે. Ether માટે 1+3 carbon અને 2+2 carbon distribution સરખાવો.',
'Metamerism is a traditional constitutional-isomer classification used for compounds with a linking functional group, such as ethers. Different carbon distributions on the two sides of the linking atom or group can give different structures with the same overall formula.',
'Keep the functional class fixed. Partition the available carbon atoms between the two sides, then consider distinct skeletons within each partition. Swapping left and right in an ether drawing does not itself create another compound because the molecular connections remain equivalent.',
'1-Methoxypropane, CH3–O–CH2CH2CH3, and ethoxyethane, CH3CH2–O–CH2CH3, are C4H10O ethers. Their carbon distributions about oxygen are 1+3 and 2+2. Compare the actual graphs in the model window.',
'CH3–O–CH2CH2CH3 and CH3CH2CH2–O–CH3 are the same ether. Do not count an exchanged drawing twice. Classroom metamerism conventions may differ in borderline cases.',
'Use constitutional isomerism as the fundamental description. Categories such as metamerism and chain isomerism can overlap under different teaching conventions, so a rigorous answer identifies the changed connections and states the convention used.',
'Does reversing the two sides of ethoxyethane produce a new metamer?','No. Equivalent ethyl groups have simply exchanged drawing positions.'),
L('ring','foundation','Ring–chain isomerism','A ring and a multiple bond can share a formula','Foundation','ring',
'એક ring બંધ કરવાથી open-chain saturated structure કરતાં સામાન્ય રીતે બે H ઓછા થાય છે. તેથી cycloalkane અને alkene ઘણી વખત CnH2n formula ધરાવે છે. પરંતુ formula જોઈને જ ring છે એવું ન નક્કી કરો.',
'Ring–chain isomers differ in whether atoms form a ring or an open chain. An alkene and a cycloalkane can share a molecular formula because a ring and a double bond each account for one degree of unsaturation.',
'Calculate composition first. Then identify ring closures and multiple bonds independently. The degree of unsaturation, or DBE, is a useful constraint: for an ordinary neutral closed-shell formula containing C, H, N, and halogens, DBE = (2C + 2 + N − H − X)/2. Oxygen does not enter this expression.',
'Propene and cyclopropane both have C3H6. Propene contains one C=C bond; cyclopropane has one ring and only C–C single bonds. They are different constitutional structures, not conformers of one another.',
'C3H6 does not uniquely specify propene. Likewise, DBE = 1 does not distinguish a ring from a double bond. The formula alone cannot determine connectivity.',
'DBE assumes a conventional valence model; unusual ions, radicals, or nonstandard valence require separate treatment. A triple bond contributes two units. Use the number as a consistency check rather than a complete structure generator.',
'What is the DBE of C4H8?','One. A ring or a double bond is possible; further evidence is needed.'),
L('tautomer','foundation','Tautomerism & resonance','Moving nuclei is different from moving electrons','JEE Advanced','tautomer',
'Tautomerism માં H atom નું સ્થાન અને π bond નું સ્થાન બંને બદલાય છે. Resonance માં nuclei સ્થિર રહે છે; માત્ર electronic description બદલાય છે. Keto–enol conversion એક chemical equilibrium છે, માત્ર bond rotation નથી.',
'Tautomers are interconverting constitutional isomers. In a common keto–enol pair, a proton changes attachment and a carbonyl bond is replaced by an alkene plus an O–H bond. The two forms are separate molecular structures in an equilibrium.',
'For ordinary keto–enol tautomerism, locate a carbonyl group and a hydrogen on an adjacent alpha carbon. Draw the new C=C bond between that alpha carbon and the carbonyl carbon, move the hydrogen to oxygen, and restore all valences. Acid- and base-catalysed mechanisms involve different intermediates; a bare intramolecular hydrogen jump is not generally the realistic pathway.',
'Propanone gives CH2=C(OH)CH3 as its enol. Both forms have C3H6O, but the bonds and H attachments differ. The lab displays the two endpoints rather than pretending that simple rotation changes one into the other.',
'The alpha-H test is a useful condition for ordinary carbonyl enolisation, not a universal test for every type of tautomerism. Resonance contributors do not exchange a proton and are not an equilibrium mixture.',
'Equilibrium depends on solvent, substitution, conjugation, hydrogen bonding, and sometimes aromatic stabilisation. The keto form often dominates simple carbonyl systems, but this is not universal. Enol geometrical isomers and enolate geometry can become important in stereoselective synthesis.',
'Why are keto and enol structures not resonance contributors?','Their nuclei, including the transferred H, have different attachments. Resonance leaves nuclear positions and connectivity fixed.'),
L('constitutional-count','foundation','Counting constitutional isomers','Systematic generation beats memorised totals','JEE Advanced','chain',
'Count કરતા પહેલાં formula અને compound class ની શરતો વાંચો. Carbon skeletons બનાવો, symmetry-equivalent positions દૂર કરો અને દરેક structure નું valence તપાસો. Optical isomers માંગ્યા હોય ત્યારે જ configurations અલગ ગણો.',
'Constitutional counting means counting distinct atom-connectivity graphs. A question may restrict the allowed structures to acyclic alcohols, saturated compounds, monochloro derivatives, or another class. Those restrictions change the answer.',
'Start with DBE and allowed functional groups. Generate distinct carbon skeletons. Place functional features at inequivalent sites, remove duplicates, and check formula and valence. Only after the constitutional list is complete should you add stereochemical multiplicities if the question asks for all stereoisomers.',
'For monochloro derivatives of propane, the unbranched skeleton has a terminal site and a central site. Its two ends are equivalent. For C5H12 itself, the three skeletons are pentane, 2-methylbutane, and 2,2-dimethylpropane.',
'Do not multiply every structure by 2^n without checking symmetry and the scope of the question. Rotamers are not normally counted as separate configurational isomers in routine constitutional-counting problems.',
'Label atoms temporarily to compare connections, but remove arbitrary labels when testing molecular identity. A graph can map onto itself by permuting equivalent atoms. That is chemically different from arbitrarily exchanging distinguishable groups during a stereochemical argument.',
'Should the R and S forms of butan-2-ol be two constitutional isomers?','No. They share one constitution and represent two configurations.'),
L('geometrical','space','Geometrical isomerism','Restricted motion creates distinguishable arrangements','Foundation','ez',
'C=C ની આસપાસ સામાન્ય single bond જેવી free rotation નથી. Alkene ના દરેક carbon પર બે જુદા substituents હોય ત્યારે E/Z pair શક્ય બને. Rings માં cis/trans ની વ્યાખ્યા ring ની same કે opposite face પરથી થાય છે.',
'A double bond limits rotation because twisting changes the orbital overlap responsible for the pi bond. When each alkene carbon has two different substituents, two different relative arrangements can exist. Rings can also restrict arrangements and support cis/trans relationships.',
'For an alkene, inspect each end separately: A–B on one carbon must differ, and C–D on the other must differ. The two ends do not need to carry the same pair of groups. For a ring, identify whether the selected substituents occupy the same or opposite ring face.',
'But-2-ene has a geometrical pair. Propene does not, because its terminal alkene carbon carries two H atoms. In a disubstituted cyclohexane, cis means both substituents up or both down; trans means one up and one down.',
'A chair flip exchanges axial and equatorial positions without changing cis into trans. Also, “trans is always more stable” and “cis always has the higher boiling point” are unsafe universal rules.',
'Geometrical accessibility in rings depends on ring size and strain. A formally imaginable configuration may be highly strained or not isolable. Oximes and some other double-bond systems need their own stereochemical naming treatment; do not apply alkene shortcuts without checking the bonding.',
'Can 2-methylpropene have an E/Z pair?','No. One alkene carbon bears two identical methyl groups and the other bears two H atoms.'),
L('ez','space','E/Z assignment','Priority, rather than visual similarity','JEE Advanced','ez',
'બંને alkene carbon પર અલગથી CIP priority નક્કી કરો. Higher-priority groups same side હોય તો Z અને opposite side હોય તો E. Cis હંમેશાં Z હોય એવું નથી; પસંદ થયેલા groups કયા છે તે મહત્વનું છે.',
'E/Z naming removes the ambiguity of asking which two groups are “together.” Assign priorities independently to the two substituents on each end of the double bond. Compare only the higher-priority group from each end.',
'At the first attached atom, larger atomic number normally gives higher priority. If tied, compare the next attached atoms in sorted order until the first difference. Isotope mass and multiple-bond duplicate-atom conventions can matter. Then inspect same-side versus opposite-side geometry relative to the double-bond framework.',
'In but-2-ene, CH3 outranks H at both ends. Together gives Z; opposite gives E. If an alkene contains Br and Cl at one end, the directly attached Br outranks Cl even if a lower-priority group looks visually larger.',
'Do not compare all four groups as one ranked list. Each end has its own pairwise ranking. A double bond may have a definite configuration even when cis/trans terminology is inconvenient.',
'The descriptor is a structural label, not a stability label. A priority change caused by a chemical transformation can change E to Z without a simple visual reversal of the group you happen to be following. Reassign priorities in the product.',
'If the higher-priority groups are opposite, what is the descriptor?','E, from entgegen. “Z = zusammen” is a useful memory aid for together.',
[[B,'IUPAC Blue Book · Configuration']]),
L('conformation','space','Conformation vs configuration','Change the molecule or change the viewpoint?','Foundation','conformer',
'Camera rotate કરવાથી molecule બદલાતો નથી. Single bond ની આસપાસ એક fragment rotate કરવાથી conformation બદલાય છે. Configuration બદલવા માટે સંબંધિત stereogenic arrangement બદલવું પડે; energy barrier પણ મહત્વની છે.',
'A conformation is one spatial arrangement of a molecule related to others by rotations about formally single bonds. Configuration concerns the arrangement of stereogenic units. A camera rotation changes neither: it only changes the observer’s viewpoint.',
'Ask what physically moves. If the entire structure moves rigidly, the molecular state is the same. If one fragment turns around a bond, examine conformational change. If a stereogenic arrangement changes, determine the process required and whether a substantial barrier prevents rapid interconversion.',
'Rotating butane about C2–C3 changes the methyl–methyl dihedral angle and moves between anti, gauche, and eclipsed arrangements. Rotating the whole butane model on screen changes only its orientation. Neither operation changes its constitutional graph.',
'“A single bond always rotates freely” is inaccurate. Ring constraints, steric crowding, partial double-bond character, and conjugation can hinder rotation. Stable atropisomers illustrate why the timescale matters.',
'Configuration is not rigorously defined by the slogan “a bond must always break.” Inversion and other pathways can change a stereogenic arrangement without the simple bond-breaking picture used in elementary courses. Describe the actual motion and its barrier.',
'Which viewer control changes conformation: drag-to-rotate or the torsion slider?','The torsion slider changes internal geometry. Dragging rotates the viewpoint.',
[[G+'C01258','IUPAC · Conformation']]),
L('butane','space','Ethane & butane energy landscapes','Dihedral angle explains anti, gauche and eclipsed','JEE Advanced','conformer',
'Butane માં CH3–C–C–CH3 dihedral 180° હોય ત્યારે anti અને લગભગ 60°/300° હોય ત્યારે gauche. 0° પર methyl groups eclipse થાય છે. Eclipsed arrangements torsional અને steric effects ને કારણે ઊંચી energy ધરાવે છે.',
'A dihedral or torsion angle describes the relationship between two planes formed by four consecutive atoms. Looking along a C–C bond gives a Newman projection. Ethane has equivalent staggered minima and eclipsed maxima; butane has distinguishable methyl–methyl arrangements.',
'Set the front carbon as a reference and rotate the rear fragment. In butane, 180° places the methyl groups anti. Near 60° and 300° they are gauche. At 0° the methyl groups eclipse each other; eclipsed arrangements at 120° and 240° instead involve methyl–H eclipsing.',
'Move the slider through one complete rotation and follow both the 3D model and the Newman projection. The qualitative energy curve has anti as the lowest minimum for ordinary butane, gauche local minima, and eclipsed maxima.',
'Staggered does not mean “all staggered conformers have the same energy.” That works for ethane’s equivalent staggered arrangements, but not for anti and gauche butane. The displayed energy scale is schematic, not a fitted experimental potential.',
'Conformer populations follow free-energy differences, with degeneracy included. Two equivalent gauche wells contribute together. Stereoelectronic effects can alter preferences in other molecules, so butane’s ordering is not a universal rule for every substituted ethane.',
'Why does butane have two gauche minima but only one anti minimum in a full turn?','The relative methyl angle can be +60° or −60°; these are two gauche wells. The anti arrangement is at 180°.'),
L('chair','space','Cyclohexane & substituted chairs','Axial/equatorial changes; up/down stays','JEE Advanced','chair',
'Chair flip દરમિયાન axial group equatorial થાય છે અને equatorial group axial થાય છે. પરંતુ up group up જ રહે છે. Methylcyclohexane માં methyl equatorial હોય તે chair સામાન્ય રીતે વધુ stable છે, કારણ કે 1,3-diaxial interactions ઘટે છે.',
'The chair conformation of cyclohexane reduces angle and eclipsing strain. Each carbon has one axial and one equatorial direction. Axial directions alternate up and down around the ring; an equatorial bond at a given carbon has the opposite up/down sense from its axial bond.',
'Assign every substituent two labels: up/down and axial/equatorial. Perform the ring flip, exchange axial with equatorial, and retain up/down. Decide cis/trans from the up/down labels, not from whether a substituent happens to be axial.',
'In methylcyclohexane, an up axial methyl becomes an up equatorial methyl after a flip. For 1,2-disubstitution, trans can be diequatorial or diaxial, whereas cis has one axial and one equatorial. For 1,3-substitution, cis can be diequatorial; for 1,4-substitution, trans can be diequatorial.',
'The most stable conformer is not necessarily the most reactive conformer. In cyclohexane E2 reactions, an axial leaving group and an appropriately anti axial beta-H are often required.',
'Equatorial preference depends on substituent free-energy penalties and interactions between substituents. An A-value is conditional on conditions and the substituent; it is not a universal constant for every ring environment. The lab displays idealised chair endpoints, not an energy-minimised flip pathway.',
'Can a chair flip turn cis-1,2-dimethylcyclohexane into its trans form?','No. Up/down relationships stay fixed; only axial/equatorial assignments exchange.'),
L('chirality','stereo','Chirality & symmetry','A property of the whole structure','Foundation','mirror',
'Chiral molecule પોતાના mirror image પર superimpose ન થઈ શકે. ચાર જુદા groups ધરાવતો tetrahedral centre એક સામાન્ય કારણ છે, પણ chirality માટે C* હોવો ફરજિયાત નથી. આખી molecule ની symmetry તપાસવી પડે.',
'A molecular structure is chiral when it cannot be superposed on its mirror image by proper rotations and translations. Handedness is a property of the complete structure. A tetrahedral atom attached to four distinguishable groups is a common source, but it is not the only one.',
'Build the mirror image, preserve the connectivity and labelled substituents, and try rigid rotations. Reflection is not an allowed move when testing superposition. For symmetry reasoning, a genuine mirror plane or inversion centre makes a rigid structure achiral; in general, any improper rotation symmetry is incompatible with chirality.',
'Bromochlorofluoromethane has four distinct substituents on carbon and forms a mirror-related pair. An appropriately substituted allene can be chiral even though no carbon is a tetrahedral four-different-group centre.',
'No visible mirror plane is not by itself a complete proof of chirality. Also, a single chiral-looking conformer of a flexible molecule does not automatically establish an isolable chiral compound.',
'For a rigid structure, chirality is compatible with proper rotational symmetry and incompatible with improper rotation operations Sn. For flexible systems, consider whether mirror-related conformations interconvert rapidly under the conditions of observation.',
'Must every chiral molecule contain an asymmetric carbon?','No. Axial, planar, and helical chirality provide important counterexamples.',
[[G+'C01057','IUPAC · Chiral'],[G+'E02069','IUPAC · Enantiomer']]),
L('relations','stereo','Enantiomers, diastereomers & identity','Relationships are between two structures','Foundation','mirror',
'Same connectivity ધરાવતા બે structures mirror-related અને non-superimposable હોય તો enantiomers. Mirror-related ન હોય એવા stereoisomers diastereomers છે. માત્ર “એક centre બદલાયો” જેવા shortcut કરતાં પૂરી structure અને symmetry જુઓ.',
'Enantiomers are non-superposable mirror images. Diastereomers are stereoisomers that are not mirror-related. “Identical,” “enantiomeric,” and “diastereomeric” describe the relationship between a specified pair; they are not interchangeable labels for an isolated drawing.',
'Check constitution first. For simple, correctly mapped tetrahedral stereocentres, invert all stereogenic configurations to generate the mirror structure. Then inspect molecular symmetry: labels alone can disguise equivalence in meso systems. Changing only some independent stereogenic elements usually gives a diastereomer.',
'For 2,3-dichlorobutane, (2R,3R) and (2S,3S) form an enantiomeric pair. The meso (2R,3S) structure is a diastereomer of either one. With equivalent ends, the drawings labelled (2R,3S) and (2S,3R) describe the same meso compound after appropriate renumbering.',
'“Opposite at every centre means enantiomers” needs symmetry checking. Also, E and Z alkenes are commonly diastereomers even though no tetrahedral stereocentre is present.',
'Enantiomers have matching ordinary scalar physical properties in an achiral environment under the same conditions, apart from equal-and-opposite optical rotation. Chiral environments can distinguish them. Diastereomers need not have matching physical properties; no universal ordering of their values follows.',
'Are an E alkene and its Z isomer enantiomers?','Ordinarily they are diastereomers: they differ stereochemically without being a non-superposable mirror pair.',
[[G+'D01679','IUPAC · Diastereoisomer'],[G+'E02069','IUPAC · Enantiomer']]),
L('cip','stereo','CIP priority rules','Compare at the first point of difference','JEE Advanced','rs',
'CIP માં પહેલા directly attached atom નો atomic number જુઓ. Tie હોય તો આગળના attached atoms ની sorted list સરખાવો. Isotopes માં વધારે mass number ને priority. Molecular weight અથવા group કેટલો મોટો દેખાય છે તે સીધો નિયમ નથી.',
'CIP priorities order ligands so that a stereochemical descriptor can be assigned consistently. In the common elementary cases, compare atomic numbers of the directly attached atoms. A heavier isotope of the same element receives higher priority than a lighter isotope.',
'When first atoms tie, compare their attached-atom lists, excluding the path back to the centre, in decreasing atomic-number order. Move outward level by level to the first difference. Do not add atomic numbers. Multiple bonds are represented through duplicate-atom conventions; rings require controlled path expansion to avoid endlessly circling the ring.',
'At a centre bearing OH, CHO, CH2OH, and H: O is ahead of C, and H is last. For the tied carbon ligands, CHO is treated as having [O,O,H], while CH2OH gives [O,H,H]. Thus CHO outranks CH2OH.',
'Mass of the entire group is not a CIP ranking rule. A directly attached isotope is handled within its element; it does not outrank a different element merely by having a larger mass number.',
'CIP contains additional sequence rules for stereogenic ligands and other complex cases. Pseudoasymmetry and enantiomorphic ligands need those rules. This app computes descriptors only for its curated, validated examples; it is not a general-purpose CIP solver.',
'Which usually outranks the other at a tied carbon: –CH2OH or –CH2CH3?','–CH2OH. Compare [O,H,H] with [C,H,H]; O beats C at the first difference.',
[[G+'C01082','IUPAC · CIP priority']]),
L('rs','stereo','R/S assignment, step by step','Rank → orient → trace → check','JEE Advanced','rs',
'1 થી 4 priority આપો. Group 4 દૂર હોય ત્યારે 1→2→3 clockwise હોય તો R, anticlockwise હોય તો S. Group 4 તમારી તરફ હોય તો મળેલો પરિણામ reverse કરવો. Molecule આખો ફેરવવાથી R/S બદલાતું નથી.',
'R/S specifies the absolute configuration of an appropriate tetrahedral stereogenic centre. First establish the four priorities correctly. Next view the centre with priority 4 pointing away. Trace the sequence 1 → 2 → 3: clockwise gives R; anticlockwise gives S.',
'If group 4 points towards you, reverse the apparent result. If it lies in the drawing plane, perform a proper spatial reorientation or use a carefully tracked permutation. One exchange of two ligands reverses configuration; two exchanges preserve it. Never exchange groups silently.',
'In the lab molecule, Br > Cl > F > H. Priority badges remain attached to the correct atoms while you rotate the model. The R/S badge is computed from the fixed geometry in priority order and therefore stays constant under camera rotation.',
'R does not mean dextrorotatory and S does not mean levorotatory. Clockwise from an arbitrary viewpoint is also insufficient: priority 4 must be treated correctly.',
'In a reaction, geometric inversion at a centre does not guarantee that an R reactant becomes an S product. The substituent priorities may change during the reaction. Determine the spatial outcome and then reassign the product descriptor independently.',
'If 1→2→3 is clockwise but group 4 points toward you, what is the result?','S. Reverse the apparent clockwise result because the lowest-priority group is toward the observer.',
[[G+'R05423','IUPAC · R/S'],[B,'IUPAC Blue Book · CIP naming']]),
L('meso','stereo','Meso compounds & racemates','One achiral structure versus a mixture','JEE Advanced','meso',
'Meso compound એક જ achiral compound છે, ભલે તેમાં stereogenic centres હોય. Racemate બે enantiomers નું 1:1 mixture છે. બંને net optical rotation ન બતાવે, પણ તેનું કારણ અલગ છે.',
'A meso compound is achiral despite containing stereogenic centres or elements of the relevant type. A racemate is an equimolar mixture of two enantiomers. These are fundamentally different situations: molecular achirality versus cancellation in a mixture.',
'For a possible meso structure, inspect the complete connectivity and symmetry rather than merely counting centres. Equivalent ends and an internal symmetry relationship can make opposite local configurations part of one achiral molecule. A visible symmetry plane in an appropriate conformation is a useful demonstration, but use whole-structure reasoning.',
'2,3-Dichlorobutane has three configurational stereoisomers: (2R,3R), (2S,3S), and meso-(2R,3S). The first two are enantiomers. The RS and SR descriptions with exchanged equivalent ends refer to the same meso structure.',
'Two centres with opposite descriptors do not automatically make a meso compound: the ligands and molecular symmetry must support it. A racemate is not “one meso molecule.”',
'A racemic sample may crystallise in different ways, including a racemic compound or a conglomerate. Optical inactivity alone does not identify a sample as meso or racemic; independent structural or compositional evidence is needed.',
'Does every (R,S) molecule have to be meso?','No. Unequal ends or an unsymmetrical substitution pattern can make an R,S molecule chiral.'),
L('fischer','projection','Fischer projections','A drawing convention with spatial meaning','JEE Advanced','fischer',
'Fischer projection માં horizontal bonds તમારી તરફ અને vertical bonds પાછળ હોય છે. Page માં 180° rotation configuration રાખે છે; 90° rotation સામાન્ય રીતે રાખતું નથી. એક centre પર બે groups exchange કરવાથી configuration invert થાય છે.',
'A Fischer projection encodes tetrahedral geometry on a cross. Horizontal substituents project towards the observer and vertical substituents away. The cross is not a flat square-planar molecule. For multiple centres, each intersection must be interpreted using the convention.',
'Assign CIP priorities at the selected intersection. Because a horizontal lowest-priority group points towards you, reverse the apparent 1→2→3 result. A 180° rotation of a complete Fischer drawing in its plane preserves configuration; a 90° rotation is not a generally valid identity operation.',
'For the lab’s R halomethane, a Fischer arrangement with F above, H below, Cl left, and Br right gives R: H is vertical and therefore away, and the priority order Br → Cl → F is clockwise. Interchanging Cl and Br makes the S form.',
'Do not rotate a Fischer projection by 90° and then keep using the horizontal-toward convention as though nothing changed. Also, changing the selected carbon chain can require a genuine spatial reconstruction.',
'For long Fischer chains, a comparison is safest when the same backbone direction and atom mapping are used. Relative labels such as erythro/threo refer to a chosen conventional representation and do not replace full absolute descriptors.',
'How many pairwise exchanges at one centre preserve its configuration?','An even number. One exchange inverts it; two exchanges restore the original parity.',
[['https://iupac.qmul.ac.uk/stereo/intro.html','IUPAC · Three-dimensional representations']]),
L('newman','projection','Newman & sawhorse projections','Choose the viewing bond before comparing','JEE Advanced','newman',
'Newman માં આગળનો carbon dot અને પાછળનો carbon circle થી બતાવાય છે. કયા carbon થી કયા carbon તરફ જુઓ છો તે લખો. Sawhorse અને Newman એક જ conformation ની અલગ views હોઈ શકે.',
'A Newman projection looks directly along a selected bond. The front carbon is represented by the central junction and the rear carbon by a circle. A sawhorse drawing views that bond obliquely, so the carbon–carbon backbone is visible.',
'Label the two bond atoms and their substituents before converting. Fix the viewing direction, place the front groups, then place rear groups at the correct dihedral angles. Reversing the viewing direction changes the appearance; it does not by itself change the molecule.',
'In the butane lab, the front carbon is C2 and the rear carbon C3. At a methyl–methyl dihedral of 180°, the Newman projection is anti. Move to 60° to obtain a gauche arrangement while keeping each substituent attached to its original carbon.',
'Do not move one group independently when you mean to rotate a tetrahedral carbon fragment. All three substituents on that fragment move together around the viewed bond. A perfectly overlapped drawing can also hide a rear bond, so read labels carefully.',
'Projection conversion is a mapping problem. Track atom identity, local configuration, and the selected torsion independently. For a molecule with stereocentres, any proposed conversion must preserve its R/S descriptors unless the intended operation changes configuration.',
'Does switching from a Newman view to a sawhorse view necessarily make a new conformer?','No. The same conformation can be represented from a different viewing direction.'),
L('relative','projection','D/L, erythro/threo & absolute labels','Different naming systems answer different questions','JEE Advanced','fischer',
'D/L relative configuration બતાવે છે; +/− optical rotation બતાવે છે અને R/S CIP absolute descriptor છે. આ ત્રણ systems ને એક જ અર્થમાં ન લો. Erythro/threo માટે conventional Fischer chain માં પસંદ કરેલા groups ની same/opposite side જુઓ.',
'D/L is a relative-configuration system historically referenced to glyceraldehyde and used in defined classes such as carbohydrates and amino acids. It is independent of the experimentally observed sign of rotation. R/S is assigned using CIP rules and answers a different naming question.',
'For the conventional Fischer representation of a simple aldose with the carbonyl end above, the configuration at the highest-numbered stereogenic carbon determines D or L: the reference OH is right for D and left for L. Apply amino-acid conventions separately rather than transferring a sugar shortcut without checking.',
'In a suitable Fischer chain containing two adjacent stereocentres and comparable substituents, the chosen like groups on the same side are described as erythro; opposite sides give threo. This is a relative relationship, not an automatic RR/SS or RS/SR label for every molecule.',
'Do not infer D = (+), L = (−), or D = R. Even familiar relationships have exceptions when CIP priorities differ. Cysteine is a useful reminder that biological relative labels and absolute labels are separate systems.',
'Use explicit stereodescriptors in rigorous naming when the relative shorthand is ambiguous. Always state the backbone orientation and which groups are being compared in an erythro/threo discussion.',
'Can a D compound be levorotatory?','Yes. D/L does not determine the sign of optical rotation.'),
L('counting','projection','Counting stereoisomers','2ⁿ is a ceiling, not a universal answer','JEE Advanced','count',
'Independent n tetrahedral centres માટે 2ⁿ upper limit ઉપયોગી છે. Symmetry થી duplicate configurations બને તો total ઓછું થાય. Meso forms અને E/Z elements અલગથી ગણો; conformers ને routine configurational count માં ન ભેળવો.',
'For n independent binary tetrahedral stereogenic centres and no symmetry-related duplication, 2^n assignments are possible. This is a useful maximum in that specified model, not a universal count for all molecules. Molecular symmetry can make distinct-looking assignments identical.',
'Enumerate the stereogenic elements, list allowed assignments, remove graph- and symmetry-equivalent structures, then classify the remaining structures into enantiomeric pairs and achiral forms. Include valid alkene configurations when present. Check whether the question asks for molecules, enantiomer pairs, optically active forms, or mixtures.',
'An unsymmetrical molecule with two independent centres can have four configurations. Symmetrical 2,3-dichlorobutane has three: RR, SS, and meso-RS. There is one enantiomeric pair plus one achiral stereoisomer.',
'Do not call a racemic mixture an extra molecular stereoisomer. Do not use 2^n when n includes non-independent elements, impossible ring configurations, pseudoasymmetric special cases, or centres with identical ligands.',
'For more complex symmetry, enumeration with a validated molecular-identity test is more reliable than memorising case-specific formulas. Constitutional automorphisms must be respected; arbitrary numbering is not a physical distinction.',
'How many configurational stereoisomers does 2,3-dichlorobutane have?','Three: an RR/SS enantiomeric pair and one meso form.'),
L('optical','projection','Optical rotation, ee & purity','A measurement is not a configuration label','JEE Advanced','optical',
'Optical rotation experimental property છે. R/S પરથી +/− જાણી શકાતું નથી. માત્ર બે enantiomers ના mixture માટે ee = |%R − %S|. Net rotation થી composition ગણવા માટે pure reference અને સમાન measurement conditions જોઈએ.',
'Optical rotation is measured under specified wavelength, temperature, solvent, concentration, and path length. Enantiomers show equal-and-opposite rotation in an achiral environment under matching conditions. R/S descriptors do not determine the sign.',
'Normalise observed rotation using [α] = αobs/(l c), with path length l in dm and concentration c in g/mL in this convention; using g per 100 mL requires the corresponding factor of 100. State wavelength and temperature. For only two enantiomers, ee = |xR − xS| × 100%, with xR + xS = 1. A 70:30 mixture has 40% ee. A matched rotation-to-pure-reference ratio estimates ee only under the appropriate additive conditions.',
'The optical lab deliberately assumes that the pure R example gives +10° and the pure S example −10° in one fixed experiment. A 70:30 mixture then gives +4°. This is a hypothetical example, not a prediction from the letter R.',
'Observed rotation near zero does not prove molecular achirality. A racemate, an insufficiently sensitive measurement, or other sample issues may also give little net rotation. The rotation-ratio method is not automatically valid for samples containing unrelated optically active substances.',
'Diastereomeric excess is defined for a specified diastereomer comparison and needs an appropriate composition model. Distinguish enantiomeric ratio, ee, chemical purity, and optical purity; they are not automatically interchangeable experimental statements.',
'What is the ee of an 80:20 mixture of two enantiomers?','60% ee. The major enantiomer is 80%, and 20% of each cancels to leave a 60% excess.'),
L('axial','advanced','Axial chirality in allenes & cumulenes','Handedness without a tetrahedral C*','CSIR-NET','axial',
'Allene માં terminal substituent planes perpendicular હોય છે. બંને terminal carbon પર બે જુદા groups હોય તો axial chirality શક્ય છે. Central carbon sp-hybridised હોવા છતાં પૂરી structure chiral હોઈ શકે.',
'An allene contains two adjacent double bonds. Its central carbon uses two mutually perpendicular pi systems, placing the terminal substituent planes perpendicular to one another. Appropriate substitution creates an axis of chirality rather than a tetrahedral chirality centre.',
'Inspect the two groups at each terminal carbon. For a simple allene, each terminal pair must be distinguishable for the standard axial-chirality case. View along the allene axis and compare the mirror-related spatial arrangements. Rigid rotation cannot convert one into its mirror partner.',
'The lab shows 1,3-dichloropropa-1,2-diene with H and Cl on each terminus. Its end-group planes are perpendicular and the pair is mirror-related. Unsubstituted propadiene, CH2=C=CH2, does not meet the distinguishable-terminal-group condition.',
'An sp carbon is not a tetrahedral asymmetric carbon. Also, not every allene is chiral. A terminal carbon with two identical groups removes this simple axial stereogenicity.',
'For ideal unbranched cumulene systems, an even number of consecutive double bonds gives perpendicular terminal substituent planes, while an odd number gives coplanar planes. Chirality or geometrical isomerism still depends on substitution and symmetry. Axial descriptors require a defined convention; the app does not guess them from camera orientation.',
'Why is CH2=C=CH2 achiral in this context?','Each terminal carbon has two identical hydrogens, so there is no distinguishable handed arrangement of terminal groups.'),
L('atrop','advanced','Atropisomerism, planar & helical chirality','Barriers and constrained shapes matter','CSIR-NET','axial',
'Hindered single-bond rotation થી લાંબા સમય સુધી અલગ રહી શકે એવા stereoisomers atropisomers કહેવાય. દરેક biphenyl chiral નથી. Planar અને helical chirality માં પણ whole structure તથા symmetry તપાસવી જરૂરી છે.',
'Atropisomerism arises when hindered rotation makes conformationally related stereoisomers distinguishable on the relevant timescale. Substituted biaryls are a common family. Their stereochemistry depends both on a suitable asymmetric substitution pattern and a sufficient interconversion barrier.',
'Separate two questions: is a particular conformation chiral, and can its mirror-related form interconvert rapidly? Steric crowding can raise a rotational barrier, but a hindered molecule is not automatically chiral. Inspect symmetry and the distinguishability of groups on each side of the axis.',
'An appropriately ortho-substituted biaryl can form an isolable axial enantiomer pair. In other systems, a constrained aromatic plane with a bridge can create planar chirality. A screw-like helicene can have P or M helicity without a conventional tetrahedral C*.',
'Do not apply the allene model as if it were a biaryl model. The viewer here illustrates an axial principle with an allene; the biaryl, planar, and helical cases are theoretical extensions. A single numerical barrier is not a universal isolation threshold.',
'Temperature, solvent, and the duration of an experiment change whether interconversion is slow or fast. Specify the observation conditions when describing configurational stability. P/M helicity and axial R/S conventions are distinct naming procedures.',
'Does hindered rotation alone prove that a compound is chiral?','No. The substitution pattern and complete molecular symmetry must also permit a chiral arrangement.'),
L('topicity','advanced','Homotopic, enantiotopic & diastereotopic','The replacement test reveals hidden relationships','CSIR-NET','mirror',
'બે સમાન દેખાતા H ને અલગ-અલગ D થી replace કરો. Products identical હોય તો homotopic; enantiomers હોય તો enantiotopic; diastereomers હોય તો diastereotopic. NMR equivalence માં medium અને dynamics પણ અસર કરે છે.',
'Topicity describes the relationship between two atoms, groups, or faces in a specified molecule. The replacement test is particularly useful: replace one candidate at a time with the same distinguishing label and compare the two products.',
'If the replacement products are identical, the sites are homotopic. If they are enantiomers, the sites are enantiotopic. If they are diastereomers, the sites are diastereotopic. Preserve all existing stereochemical information while performing the comparison.',
'Replacing either H on the CH2 carbon of ethanol by D gives an R/S pair, so those hydrogens are enantiotopic in the achiral parent. A CH2 group next to an existing stereocentre can instead have diastereotopic hydrogens, because the two labelled products differ at only part of the stereochemical structure.',
'Two hydrogens attached to one carbon are not automatically chemically equivalent. Conversely, accidental overlap can make different NMR resonances appear at the same shift. Chemical equivalence and magnetic equivalence are separate questions.',
'Enantiotopic sites usually have the same chemical shift in an achiral medium but may be distinguished in a chiral environment. Diastereotopic sites can differ even in an achiral medium. Conformational averaging must be considered before predicting the observed spectrum.',
'What product relationship identifies enantiotopic sites?','Replacing either site with the same label gives enantiomeric products.',
[[G+'E02083','IUPAC · Enantiotopic'],[G+'D01685','IUPAC · Diastereotopic']]),
L('prochirality','advanced','Prochirality, pro-R/pro-S & Re/Si','Label a potential stereochemical outcome','CSIR-NET','rs',
'એક change થી chiral બની શકે તેવા achiral system ને prochiral કહી શકાય. Trigonal planar face માટે priorities 1→2→3 clockwise હોય તો Re અને anticlockwise હોય તો Si. Face label પરથી product R/S સીધું ન નક્કી કરો.',
'Prochirality connects an achiral starting structure with a possible chiral product. At a tetrahedral site bearing two equivalent groups, distinguish one group and examine which absolute configuration would result. This gives pro-R and pro-S labels under the stated CIP procedure.',
'For an appropriate trigonal planar centre, rank its three ligands. View one face: if 1 → 2 → 3 is clockwise, that face is Re; if anticlockwise, it is Si. The other face has the complementary descriptor. Keep the viewing side explicit.',
'A carbonyl carbon can be attacked from either face. A chiral catalyst or an existing stereocentre may favour one. To obtain the product R/S descriptor, construct the tetrahedral product and assign all four new priorities; the newly introduced group changes the ranking problem.',
'Re does not universally mean “attack gives R.” Likewise, a pro-R hydrogen is not itself an R-configured atom. These are labels defined by a hypothetical operation.',
'Prochirality and stereotopicity require careful use in advanced nomenclature. A face can be enantiotopic or diastereotopic relative to another face depending on the complete molecular context. Explain the product relationship instead of relying only on visual symmetry.',
'Does attack on a Re face always give an R product?','No. The product descriptor depends on the priorities of all four substituents in the product.',
[[G+'P04859','IUPAC · Prochirality'],[B,'IUPAC Blue Book · Stereodescriptors']]),
L('pseudo','advanced','Pseudoasymmetry & r/s','When ligand stereochemistry breaks a tie','CSIR-NET','meso',
'Pseudoasymmetric centre માટે lowercase r/s descriptors વપરાય છે. Constitutionally equivalent પરંતુ enantiomorphic ligands ની priority નક્કી કરવા advanced CIP rules જોઈએ. ચાર જુદા groups દેખાય એટલે આખી molecule chiral છે એવું ન માનો.',
'Some tetrahedral stereogenic arrangements involve two ligands that are constitutionally equivalent but related through opposite stereochemical configurations. After the appropriate CIP sequence rules resolve the enantiomorphic-ligand comparison, a pseudoasymmetric centre may receive a lower-case r or s descriptor.',
'First establish the constitution and assign the relevant stereochemistry within the ligands. Apply the full sequence-rule comparison, not a molecular-weight shortcut. Distinguish a pseudoasymmetric stereogenic unit from a true chirality centre and inspect the whole molecular symmetry.',
'An achiral structure can contain a pseudoasymmetric centre. Interchanging two ligands there can produce a different diastereomeric structure without producing a simple enantiomeric pair of whole molecules. This is why counting every labelled centre as an independent R/S switch is unreliable.',
'Do not attach lower-case descriptors to every centre in a meso molecule. The ordinary R and S centres in meso-2,3-dichlorobutane are not automatically pseudoasymmetric. The viewer illustrates meso symmetry, not a solved pseudoasymmetric example.',
'Under the relevant conventions, lower-case pseudoasymmetric descriptors are invariant on mirror reflection, unlike upper-case R/S chirality descriptors. Complex assignments need the authoritative CIP rules; this module teaches the distinction and does not act as an unrestricted assignment engine.',
'Should every stereocentre in a meso molecule be labelled r or s?','No. Pseudoasymmetry is a specific ligand-comparison situation, not another name for meso.',
[[B,'IUPAC Blue Book · Pseudoasymmetric stereodescriptors']]),
L('selectivity','application','Stereoselective vs stereospecific','Preference and stereochemical mapping are different','CSIR-NET','ez',
'Stereoselective reaction માં possible stereoisomers માંથી એક વધારે બને છે. Stereospecificity માં starting stereoisomer બદલવાથી corresponding product stereoisomer બદલાય છે. માત્ર high product ratio જોઈને stereospecific ન કહો.',
'Stereoselectivity is a preference for forming one stereoisomer over another. Stereospecificity concerns the relationship between starting stereoisomers and their products: reactants differing in configuration give stereoisomerically different products through the reaction pathway.',
'For selectivity, compare product amounts from a specified substrate. For specificity, compare the reactions of stereoisomeric substrates and track their stereochemical mapping into products. State the mechanism and its assumptions; a numerical product ratio alone does not establish specificity.',
'Backside SN2 substitution gives inversion of local geometry at an appropriate tetrahedral centre. Stereoisomeric starting materials therefore have corresponding stereochemical outcomes. A hydrogenation or reduction may preferentially generate one face-derived product; its selectivity depends on the substrate and conditions.',
'“Stereospecific” is not a synonym for “100% stereoselective.” Also, local geometric inversion and a change from R to S are not automatically the same statement when CIP priorities change.',
'Enantioselectivity concerns enantiomer preference; diastereoselectivity concerns diastereomer preference. Chemoselectivity and regioselectivity describe different choices. A complete reaction answer can require several independent selectivity descriptions.',
'Does a 99:1 product ratio alone prove stereospecificity?','No. It establishes strong selectivity for that experiment; substrate-to-product stereochemical mapping must be assessed separately.',
[[G+'S05991','IUPAC · Stereoselectivity'],[G+'S05994','IUPAC · Stereospecificity']]),
L('stereoelectronic','application','Syn/anti & stereoelectronic requirements','Three-dimensional geometry controls reaction paths','CSIR-NET','chair',
'E2 માટે leaving group અને beta-H નું anti-periplanar alignment ઘણીવાર જરૂરી છે. Cyclohexane chair માં આ trans-diaxial arrangement બની શકે. Syn/anti addition new groups ની relative face બતાવે છે, E/Z જેવા naming labels નથી.',
'Stereoelectronic effects connect molecular geometry with orbital interactions in a reaction. A familiar example is E2 elimination, where suitable alignment between the breaking C–H bond, the forming pi system, and the leaving-group bond is important.',
'Locate the alpha and beta carbons, identify candidate beta hydrogens, and inspect the dihedral angle to the leaving group. An anti-periplanar arrangement is commonly favoured. In a cyclohexane chair, the appropriate axial leaving group and axial beta-H give a trans-diaxial relationship.',
'A substrate can occupy a more stable equatorial conformer yet react through a less populated axial conformer. If no properly aligned beta-H is available in the accessible reactive geometry, the usual simple elimination prediction may fail or a different pathway may compete.',
'An axial leaving group alone is not enough: verify the beta-H and its anti alignment. Also, syn or anti addition describes the relationship of newly attached groups, not a guarantee of one universal R/S product.',
'For alkene additions, track both starting E/Z geometry and whether addition is syn or anti, then check whether the products are enantiomeric, meso, or diastereomeric. Use mechanism-specific assumptions rather than a general “syn means cis” shortcut across all substrates.',
'Why can the less stable chair control an E2 reaction?','It may be the conformer that places the leaving group and beta-H in the required reactive alignment.'),
L('dynamics','application','Conformer populations & dynamic stereochemistry','Energy, entropy and timescale','CSIR-NET','conformer',
'Equilibrium population માટે free energy જોઈએ, માત્ર potential-energy drawing પૂરતી નથી. pB/pA = exp[−(GB−GA)/RT] છે. Equivalent conformers ની degeneracy ગણો. NMR માં fast/slow exchange observation timescale પર આધાર રાખે છે.',
'Conformers at equilibrium are populated according to their free energies. For two individually specified states, pB/pA = exp[−(GB − GA)/RT]. If a labelled family includes multiple equivalent microstates, its degeneracy also contributes to the total population.',
'Keep the sign and units consistent. R and the energy difference must use matching units; temperature is in kelvin. Distinguish a free-energy difference, which controls equilibrium, from an activation free-energy barrier, which controls the interconversion rate.',
'Butane has two equivalent gauche wells and one anti well. If each gauche state is higher by a free-energy difference ΔG, their combined population relative to anti includes a factor of two: pgauche,total/panti = 2 exp(−ΔG/RT), within that simplified state model.',
'The energy plot in this app is qualitative and cannot supply experimental populations. A barrier height is not the same as the relative energy of two minima. Entropy and solvent can change the ordering inferred from a simple steric picture.',
'Fast NMR exchange means fast relative to the frequency difference being observed, not “fast in an absolute sense.” Nitrogen inversion, restricted amide rotation, ring flipping, and atropisomerisation illustrate how dynamics changes observed stereochemical behaviour.',
'Which controls equilibrium population: ΔG or ΔG‡?','The free-energy difference ΔG controls equilibrium. The activation barrier ΔG‡ controls the rate of interconversion.'),
L('curtin','application','The Curtin–Hammett principle','The major conformer need not give the major product','CSIR-NET','conformer',
'બે conformers reaction કરતાં વધુ ઝડપથી interconvert થાય અને અલગ products બનાવે ત્યારે product ratio માત્ર conformer ratio પરથી નક્કી ન થાય. Competing transition states ની relative free energies જોવી પડે. આ શરતો ચકાસ્યા વગર rule ન લગાવો.',
'Consider conformers A and B that interconvert rapidly and react through different pathways to products P and Q. Under the Curtin–Hammett conditions, product selection depends on the relative free energies of the competing product-forming transition states, rather than on conformer abundance alone.',
'Check three assumptions: conformer exchange is fast relative to product formation, the competing pathways are correctly identified, and the products do not rapidly equilibrate in a way that overrides the kinetic outcome. Compare transition states on the same free-energy reference.',
'Even if A is the major conformer, B can give the major product when its product-forming transition state is sufficiently lower. In a simplified pair of competing pathways, define ΔΔG‡ = G‡Q − G‡P; then Q/P is proportional to exp(−ΔΔG‡/RT), with any relevant statistical factors treated consistently.',
'Do not combine “less stable conformer reacts faster” with the principle as an automatic rule. The actual transition-state energies and the fast-exchange condition are essential. If conformers react before equilibrating, a different kinetic analysis is required.',
'This is a bridge from static stereochemical drawings to reaction kinetics. It explains why a beautifully drawn lowest-energy conformer alone may be insufficient for predicting stereoselectivity. Distinguish kinetic product ratios from thermodynamic product equilibria.',
'Can a minor conformer give the major product?','Yes, if the exchange and kinetic conditions apply and its pathway has the lower relevant transition-state free energy.',
[[G+'C01480','IUPAC · Curtin–Hammett principle']]),
L('strategy','application','A reliable stereochemistry workflow','A chapter-wide method for unfamiliar structures','JEE Advanced','mirror',
'દરેક problem માટે એક જ sequence રાખો: formula → connectivity → stereogenic elements → valid configurations → symmetry → relationship → naming → conditions. Structure ને મનમાં ફેરવવામાં મુશ્કેલી પડે તો atom labels સાથે model બનાવો.',
'A reliable solution is a chain of justified decisions. Do not begin by guessing R/S, counting wedges, or memorising an apparent pattern. First determine what is being asked: structure identity, naming, counting, optical behaviour, conformation, or reaction outcome.',
'For identity and counting: verify formula, connectivity, stereogenic elements, allowed arrangements, and symmetry. For naming: establish priorities before tracing directions. For reactions: map atoms, apply the mechanism’s geometric requirement, construct the product, then assign product descriptors.',
'For a two-centre structure, label each centre, compare ligands, assign configurations, and check whether equivalent ends create a meso form. For a cyclic elimination, write up/down and axial/equatorial separately before looking for an anti beta-H.',
'A correct descriptor with an incorrect structure is still an incorrect answer. A remembered numerical count without stated assumptions is fragile. Distinguish what a 3D picture demonstrates from what needs a symmetry, energetic, or kinetic argument.',
'At NET level, integrate stereochemistry with spectroscopy and mechanism. Topicity informs NMR; conformational preferences influence coupling and reactivity; prochirality connects facial selectivity with product configuration. Use the core definitions to connect these areas instead of treating them as unrelated rules.',
'What should you do after drawing the stereochemical outcome of a reaction?','Reassign CIP priorities in the product. Do not assume that the old descriptor must simply invert or remain unchanged.')
];

L('primer','foundation','Atoms, bonds & molecular formulas','The tiny building pieces behind every molecule','Foundation','primer',
'Atom ને એક નાનો building piece માનો અને bond ને pieces વચ્ચેનું જોડાણ. Molecule ઘણા atoms જોડાઈને બને છે. CH4 માં C ની પાછળ number નથી એટલે 1 carbon; H ની પાછળ 4 એટલે 4 hydrogen. Balls અને colours સમજાવવા માટેનાં models છે—real atoms પર આવા colours painted નથી.',
'An atom is a basic unit of an element. A molecule contains atoms joined by chemical bonds. Think of a model kit: the pieces represent atoms and the links represent bonds. This is a learning picture; atoms are described by electrons and nuclei, not literally by coloured plastic balls.',
'Read a formula one symbol at a time. A missing number means one atom. A small number belongs to the symbol immediately before it. CH4 means one C and four H atoms. In the neutral examples used here, carbon has four bond-order units, oxygen normally has two, and hydrogen has one. A double bond counts twice toward that ordinary valence count.',
'Turn on All H and count the methane model: one grey carbon is connected to four light hydrogen atoms. Turn the model around. The same five atoms remain, so rotation does not change CH4. Now imagine reconnecting a larger set of pieces in a different pattern: that is the starting idea of constitutional isomerism.',
'Many organic drawings leave C-bound hydrogens unwritten. A CH3 label means a carbon with three hydrogens, even when only the carbon sphere is shown. Hidden in a drawing means omitted by convention; those atoms are still part of the molecule.',
'A molecular formula records composition; a structural formula adds connectivity; a stereochemical drawing adds spatial information. These levels answer increasingly detailed questions. The simple valence rules are useful for ordinary neutral molecules in this chapter; ions, radicals, and other bonding situations require their own treatment.',
'What does the formula CH4 tell you?','It contains one carbon atom and four hydrogen atoms. The formula alone is a count; the model adds a picture of how they are connected.'));

L('resolution','projection','Resolution & kinetic resolution','Separate enantiomers by giving them different environments','JEE Advanced','optical',
'Resolution એટલે racemic mixture માંથી enantiomers અલગ પાડવા. Achiral environment માં તેમની સામાન્ય physical properties સરખી હોવાથી chiral resolving agent, chiral stationary phase અથવા selective reaction ઉપયોગી થાય છે. Meso compound ને બે enantiomers માં resolve કરી શકાતું નથી.',
'Resolution separates the enantiomeric components of a racemate. A chiral environment can turn their otherwise equivalent interactions into distinguishable ones. Classical methods include temporary diastereomer formation, chiral chromatography, and selective biological or chemical transformations.',
'With a suitable racemic acid, react both enantiomers with one enantiomer of a chiral base. The resulting salts are diastereomeric and may differ sufficiently in solubility to separate. Recover the original enantiomer from each salt without racemisation. Successful separation is compound- and condition-dependent.',
'In a kinetic resolution, the two enantiomers react at unequal rates with a chiral agent. At an appropriate conversion, the slower-reacting substrate can be enriched while the transformed material is enriched in the other stereochemical component.',
'An ordinary non-racemising resolution can recover at most half of an initial racemate as one unchanged enantiomer. Dynamic kinetic resolution combines suitable racemisation with selective conversion, allowing the yield of an enantioenriched product to exceed 50%; this is not simply recovery of extra unchanged starting enantiomer. A meso compound is one achiral structure, not a racemic pair.',
'Distinguish resolving a mixture from asymmetric synthesis, which preferentially creates a stereochemical product. Follow conversion, yield, and ee separately. A high ee at very low conversion does not alone establish a practically efficient process.',
'Why can forming salts with a single-enantiomer base help resolve a racemic acid?','The two salts are diastereomers and can have different physical properties, allowing a suitable separation.',
[[G+'R05320','IUPAC · Resolution'],[G+'K03407','IUPAC · Kinetic resolution']]));

L('heteroatom','advanced','Chirality at N, P & S','Stereogenicity and configurational stability are separate','CSIR-NET','rs',
'Chirality માત્ર carbon સુધી મર્યાદિત નથી. Nitrogen, phosphorus અને sulfur પર પણ suitable stereogenic arrangement હોઈ શકે. સામાન્ય pyramidal amines માં inversion ઝડપી હોવાથી nitrogen-centred enantiomers અલગ રાખવા મુશ્કેલ થઈ શકે.',
'An atom other than carbon can support a stereogenic arrangement. The important questions are whether its ligands and geometry create a distinguishable handed structure, and whether the mirror-related arrangements interconvert rapidly under the conditions being considered.',
'For an ordinary pyramidal amine with three different substituents, consider nitrogen inversion through a flatter arrangement. The rapid process often prevents isolation of nitrogen-centred enantiomers at room temperature. Quaternary ammonium ions with four different groups do not have the same lone-pair inversion pathway.',
'Suitably substituted phosphines can have configurationally stable phosphorus-centred chirality. Sulfoxides with two different organic groups can also be stereogenic at sulfur. Their descriptors require the relevant CIP treatment of the actual bonding and geometry.',
'Do not say “nitrogen can never be chiral” or “every pyramidal amine is isolable as enantiomers.” Rigid frameworks, substitution, charge, and experimental conditions matter. The workbench displays a carbon-centred reference; it is not a geometric model of N, P, or S.',
'A formal stereogenic arrangement is a structural statement; configurational stability is kinetic. Relate inversion barriers to temperature and observation time. Also distinguish amine inversion from restricted amide C–N rotation, which involves a different structural and electronic problem.',
'Why can a four-different-group quaternary ammonium ion retain N-centred configuration more readily than many ordinary amines?','It lacks the ordinary pyramidal lone-pair inversion pathway. Other possible processes still depend on its structure and conditions.',
[[G+'P04956','IUPAC · Pyramidal inversion']]));

L('facial-selectivity','application','Diastereofacial addition & model choice','Non-chelation and chelation can favour different approaches','CSIR-NET','carbonyl',
'Carbonyl ની બાજુમાં પહેલેથી stereocentre હોય તો તેના બે faces diastereotopic હોઈ શકે. Product predict કરવા substrate conformation, incoming reagent, solvent અને chelation ની શક્યતા જુઓ. એક જ “less hindered side” shortcut દરેક reaction માટે ચાલતો નથી.',
'Addition to a carbonyl creates a tetrahedral arrangement at a formerly planar centre. When the substrate already contains a stereogenic element, attack on the two faces can lead to diastereomeric products. A prediction must therefore connect facial approach with a justified conformation and reaction model.',
'Under suitable non-chelating conditions, Felkin–Anh reasoning considers a favoured substrate arrangement and the approach trajectory of the nucleophile. When a reagent or metal can organise the carbonyl oxygen and a neighbouring donor into a chelate, the preferred geometry and facial outcome can change. These are conditional models, not universal product-generating rules.',
'For an alpha-alkoxy carbonyl, ask whether the oxygen atoms can coordinate to the reagent-associated metal under the stated conditions. Compare a plausible chelation-controlled pathway with a non-chelation pathway. Build the product of the chosen approach, preserve the original stereocentre, and assign any new descriptor afterwards.',
'The reference viewer shows the faces of simple ethanal, not an alpha-chiral substrate or a calculated transition state. A list of substituent sizes by itself is insufficient to solve every polar or chelating case. No major product can be assigned without a specified substrate and conditions.',
'Separate three layers: which conformers are available, which transition states react most readily, and what descriptors the resulting products receive. This connects conformational analysis, Re/Si naming, diastereoselectivity, and Curtin–Hammett reasoning without conflating them.',
'What information is missing if a problem asks for the major carbonyl-addition product but supplies no substrate drawing or reaction conditions?','The face relationships, accessible conformations, chelation possibilities, and mechanism cannot be established, so a definite stereochemical product is unjustified.',
[['https://archive.nptel.ac.in/content/storage2/courses/104103071/module8/lec23/6.html','NPTEL · Diastereoselective addition'],['https://pmc.ncbi.nlm.nih.gov/articles/PMC11304529/','Research · Felkin–Anh model']]));

function createTextMotion(onChange=()=>{}){
 const reduced=matchMedia('(prefers-reduced-motion: reduce)'),records=new Map();
 const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
 let preferred=true;
 try{preferred=localStorage.getItem('stereolab-interface-motion')!=='off';}catch{}
 const enabled=()=>preferred&&!reduced.matches;
 function finish(record){
  cancelAnimationFrame(record.frame);
  record.letters.forEach(({cell,glyph})=>{cell.classList.remove('is-coded');glyph.textContent='';});
  record.element.removeAttribute('data-motion-active');
 }
 function play(record){
  finish(record);if(!enabled()||document.hidden)return;
  const start=performance.now();let last=-50;
  record.element.setAttribute('data-motion-active','true');
  function tick(now){
   if(!record.element.isConnected||!enabled()||document.hidden){finish(record);return;}
   const elapsed=now-start;
   if(elapsed>=540){finish(record);return;}
   if(elapsed-last>=35){
    last=elapsed;
    const settled=Math.floor(Math.max(0,(elapsed-65)/410)*record.letters.length);
    record.letters.forEach(({cell,glyph},i)=>{
     cell.classList.toggle('is-coded',i>=settled);
     if(i>=settled)glyph.textContent=alphabet[Math.floor(Math.random()*alphabet.length)];
    });
   }
   record.frame=requestAnimationFrame(tick);
  }
  record.frame=requestAnimationFrame(tick);
 }
 const observer=typeof IntersectionObserver==='function'?new IntersectionObserver(entries=>{
  for(const entry of entries){
   const record=records.get(entry.target);if(!record)continue;
   if(entry.isIntersecting&&entry.intersectionRatio>=.55&&!record.visible){record.visible=true;play(record);}
   else if(!entry.isIntersecting){record.visible=false;finish(record);}
  }
 },{threshold:[0,.55]}):null;
 function register(element){
  const text=element.textContent;if(!text.trim())return;
  const shell=document.createElement('span');shell.className='decode-content';shell.setAttribute('aria-hidden','true');
  const readable=document.createElement('span');readable.className='sr-only';readable.textContent=text;
  const letters=[];
  for(const token of text.split(/(\s+)/)){
   if(!token)continue;
   if(/^\s+$/.test(token)){shell.append(document.createTextNode(token));continue;}
   const word=document.createElement('span');word.className='decode-word';
   for(const letter of token){
    if(!/[A-Za-z0-9]/.test(letter)){word.append(document.createTextNode(letter));continue;}
    const cell=document.createElement('span'),source=document.createElement('span'),glyph=document.createElement('span');
    cell.className='decode-char';source.className='decode-source';source.textContent=letter;
    glyph.className='decode-glyph';glyph.setAttribute('aria-hidden','true');
    cell.append(source,glyph);word.append(cell);letters.push({cell,glyph});
   }
   shell.append(word);
  }
  element.replaceChildren(shell,readable);element.classList.add('decode-target');
  const record={element,shell,text,letters,visible:false,frame:0};records.set(element,record);
  if(observer)observer.observe(element);
 }
 function refresh(){
  for(const [element,record]of records){
   if(!element.isConnected||element.firstChild!==record.shell){finish(record);observer?.unobserve(element);records.delete(element);}
  }
  document.querySelectorAll('[data-decode]').forEach(element=>{if(!records.has(element))register(element);});
 }
 function sync(){
  document.body.classList.toggle('motion-off',!enabled());
  if(!enabled())records.forEach(finish);
  onChange({enabled:enabled(),reduced:reduced.matches});
 }
 function visibility(){if(document.hidden)records.forEach(finish);}
 reduced.addEventListener('change',sync);document.addEventListener('visibilitychange',visibility);sync();
 return {
  refresh,
  toggle(){preferred=!preferred;try{localStorage.setItem('stereolab-interface-motion',preferred?'on':'off');}catch{}sync();},
  destroy(){observer?.disconnect();records.forEach(record=>{finish(record);if(record.element.firstChild===record.shell)record.element.textContent=record.text;});records.clear();reduced.removeEventListener('change',sync);document.removeEventListener('visibilitychange',visibility);}
 };
}
