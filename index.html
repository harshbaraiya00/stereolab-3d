 result('<span id="conformationLabel">'+conformationLabel(state.angle,state.variant===1)+'</span>','View direction: front C2 → rear C3')+'<div class="segmented"><button data-angle="0">0°</button><button data-angle="60">60°</button><button data-angle="180">180°</button></div>'+
 '<div class="diagram"><div id="newmanDiagram">'+newmanSVG(state.angle,state.variant===1)+'</div><div id="energyDiagram">'+energySVG(state.angle,state.variant===1)+'</div></div>';break;
 case 'chair':h+='<h3>Up stays up.</h3><p>Flip between the two chair endpoints and follow the methyl group.</p>'+result(state.variant?'Equatorial · UP':'Axial · UP','The attachment remains up relative to the molecular ring frame.')+seg([[0,'Axial chair'],[1,'Flipped chair']]);break;
 case 'meso':{const m=pairFor('meso',state.variant)[0];h+='<h3>Use the whole structure.</h3><p>The two ends are equivalent. Opposite local descriptors give the meso form here.</p>'+result(m.configuration,state.variant===0?'Meso · one achiral compound':'One member of an enantiomer pair')+seg([[0,'Meso'],[1,'RR'],[2,'SS']]);break;}
 case 'fischer':h+='<h3>Read the cross code.</h3><p>In the reference view: Br/Cl are toward; F/H are away. Dragging changes the viewpoint.</p>'+seg([[0,'R model'],[1,'S model']])+'<button class="secondary-button" data-fischer-view>Fischer reference view</button><div class="diagram">'+fischerSVG(state.variant===1)+'</div>';break;
 case 'count':h+=countingHTML();break;
 case 'operations':h+=operationHTML();break;
 case 'optical':h+='<h3>Compare equal-and-opposite amounts.</h3><p>Assumed experiment: pure R = +10°; pure S = −10°. R/S does not predict these signs.</p><div class="range-title"><label for="opticalSlider">R fraction</label><strong id="rValue">'+state.r+'%</strong></div><input id="opticalSlider" type="range" min="0" max="100" value="'+state.r+'"><div class="optical-plane"><i id="opticalPlane"></i></div>'+result('<span id="rotationValue"></span>','<span id="eeValue"></span>')+'<p>This calculation applies only to the stated ideal two-enantiomer example.</p>';break;
 case 'axial':h+='<h3>Look along the C=C=C line.</h3><p>The end-group planes are perpendicular. H and Cl differ at each terminus.</p>'+result('Axial enantiomer pair','An allene reference; no tetrahedral C* is required.')+'<p>This is not a biaryl, planar-chirality or helicene geometry model.</p>';break;
 case 'carbonyl':h+='<h3>Read the face you see.</h3><p>O > CH3 > H around the planar carbon. The label follows your viewpoint.</p>'+result('<span id="faceResult">Si</span>','1 → 2 → 3 clockwise: Re<br>Anticlockwise: Si')+seg([[0,'Front reference'],[1,'Back reference']])+'<p>Ethanal is a face-naming reference. Product R/S and facial selectivity need a specified reaction.</p>';break;
 case 'topicity':h+='<h3>One replacement at a time.</h3><p>Find Ha and Hb on ethanol’s CH2. Replacing one or the other by D in separate copies gives enantiomers.</p>'+result('Enantiotopic sites','The displayed molecule is the unchanged parent.')+'<p>Ha/Hb are labels, not different isotopes in this model.</p>';break;
 }
 $('inspector').innerHTML=h;$('countGallery').hidden=state.mode!=='count';$('countGallery').innerHTML=state.mode==='count'?countingGalleryHTML():'';
 if(state.mode==='rs'){viewer.priorities=state.rsStep>=1;$('priorityToggle').checked=viewer.priorities;}
 updateScene();referenceView();if(state.mode==='optical')updateOptical();
}
function referenceView(){
 if(state.mode==='carbonyl'){viewer.rx=0;viewer.ry=state.variant?Math.PI:0;}
 else if(state.mode==='fischer'){viewer.rx=0;viewer.ry=0;}
 else if(state.mode==='rs'&&[2,3,4].includes(state.rsStep))Object.assign(viewer,lowestAwayCamera(viewer.models[0]));
 viewer.draw();
}
viewer.onViewChange=()=>{
 if($('guideCameraStatus')){const view=priorityView(viewer.models[0],viewer.rx,viewer.ry);$('guideCameraStatus').textContent=view.away?'H is directly away · '+(viewer.tracePriorities?view.direction+' 1 → 2 → 3 trace':'ready to trace'):'View changed · restore H away before reading the arrow';$('guideCameraStatus').classList.toggle('needs-restore',!view.away);}
 if($('faceResult')){const f=carbonylFace(viewer.rx,viewer.ry);$('faceResult').textContent=f==='Edge-on'?'Edge-on · turn slightly':f+' face in view';}
 if($('lowestStatus')){const m=pairFor('rs',state.variant)[0],h=m.atoms.find(a=>a.priority===4),z=rotate(h.p,viewer.rx,viewer.ry)[2];$('lowestStatus').textContent=Math.abs(z)<.05?'H is close to the view plane':z<0?'Lowest H is away from you':'Lowest H is toward you · reverse the apparent trace';}
};
function updateAngle(){updateScene();$('angleSlider').value=state.angle;$('angleValue').textContent=state.angle+'°';$('conformationLabel').textContent=conformationLabel(state.angle,state.variant===1);$('newmanDiagram').innerHTML=newmanSVG(state.angle,state.variant===1);$('energyDiagram').innerHTML=energySVG(state.angle,state.variant===1);}
function updateOptical(){const rot=(2*state.r/100-1)*10,ee=Math.abs(2*state.r-100);$('rValue').textContent=state.r+'%';$('rotationValue').textContent=(rot>0?'+':'')+rot.toFixed(1)+'° assumed rotation';$('eeValue').textContent=ee+'% ee · '+(state.r===50?'racemic composition':(state.r>50?'R':'S')+' excess');$('opticalPlane').style.transform='rotate('+rot+'deg)';}
$('inspector').addEventListener('input',e=>{
 if(e.target.id==='angleSlider'){state.angle=Number(e.target.value);updateAngle();}
 if(e.target.id==='countSlider'){state.n=Number(e.target.value);$('countN').textContent=state.n;$('countValue').innerHTML=2**state.n+' <small>maximum</small>';}
 if(e.target.id==='opticalSlider'){state.r=Number(e.target.value);updateOptical();}
});
$('inspector').addEventListener('click',e=>{
 const v=e.target.closest('[data-variant]'),a=e.target.closest('[data-angle]'),m=e.target.closest('[data-switch-mode]'),hi=e.target.closest('[data-highlight]');
 if(v){state.variant=Number(v.dataset.variant);renderLab();}if(a){state.angle=Number(a.dataset.angle);updateAngle();}
 if(m){state.mode=m.dataset.switchMode;state.variant=0;$('modeSelect').value=state.mode;renderLab();}
 if(e.target.closest('[data-look-bond]')){viewer.rx=0;viewer.ry=Math.PI/2;viewer.draw();}
 if(e.target.closest('[data-fischer-view]')){viewer.rx=0;viewer.ry=0;viewer.draw();}
 if(e.target.closest('[data-orient-lowest]')){Object.assign(viewer,lowestAwayCamera(viewer.models[0]));viewer.draw();}
 if(hi){viewer.highlight=hi.dataset.highlight;viewer.draw();const m=viewer.models[0],a=m.atoms.find(a=>a.id===hi.dataset.highlight);if(a)inspectAtom(a,m);}
});
$('modeSelect').onchange=e=>{state.mode=e.target.value;state.variant=0;state.rsStep=0;state.operation='none';state.opAngle=0;state.allH=state.mode==='primer';$('allHydrogenToggle').checked=state.allH;viewer.reset();viewer.priorities=['rs','carbonyl'].includes(state.mode);$('priorityToggle').checked=viewer.priorities;renderLab();};
$('labelToggle').onchange=e=>{viewer.labels=e.target.checked;viewer.draw();};
$('hydrogenToggle').onchange=e=>{viewer.hydrogens=e.target.checked;viewer.draw();};
$('allHydrogenToggle').onchange=e=>{state.allH=e.target.checked;if(state.allH){viewer.hydrogens=true;$('hydrogenToggle').checked=true;}updateScene();};
$('priorityToggle').onchange=e=>{viewer.priorities=e.target.checked;viewer.draw();};
$('resetView').onclick=()=>{viewer.reset();referenceView();toast('View reset. The molecular configuration is preserved.');};
$('spinView').onclick=()=>{$('spinView').setAttribute('aria-pressed',String(viewer.toggleSpin()));};
const viewDialog=document.createElement('dialog');viewDialog.className='viewer-dialog';viewDialog.setAttribute('aria-label','Expanded molecular viewer');document.body.appendChild(viewDialog);
let stagePlaceholder,expandedScroll=0;
$('fullView').onclick=()=>{if(viewDialog.open){viewDialog.close();return;}expandedScroll=window.scrollY;stagePlaceholder=document.createComment('molecular-view-home');$('stage').before(stagePlaceholder);viewDialog.appendChild($('stage'));viewDialog.showModal();$('fullView').setAttribute('aria-label','Exit expanded molecular view');viewer.draw();};
viewDialog.addEventListener('close',()=>{if(stagePlaceholder){stagePlaceholder.after($('stage'));stagePlaceholder.remove();stagePlaceholder=null;}$('fullView').setAttribute('aria-label','Expand molecular view');viewer.draw();window.scrollTo({top:expandedScroll,behavior:'instant'});$('fullView').focus({preventScroll:true});});
$('lessonNav').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)navigate(b.dataset.lesson);};
$('chapterMap').onclick=e=>{
 if(handleStudyAction(e))return;
 const l=e.target.closest('[data-lesson]');if(l)navigate(l.dataset.lesson);
 if(e.target.closest('#expandChart')){const ds=[...$('chapterMap').querySelectorAll('.branch-card')],open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);$('expandChart').textContent=open?'Collapse branches':'Expand every branch';}
 if(e.target.closest('[data-open-sources]'))showSources();
};
$('mainContent').addEventListener('click',e=>{
 if(handleStudyAction(e))return;
 const depth=e.target.closest('[data-depth]');if(depth)setDepth(depth.dataset.depth,depth.closest('.simple-next')||depth.id==='openAdvanced');
 const word=e.target.closest('[data-word]');if(word)showWord(word.dataset.word);
 const j=e.target.closest('[data-jump]');if(j){if(state.depth==='simple')setDepth(j.dataset.jump==='deeper'?'deep':'guided');if(j.dataset.jump==='deeper')setDepth('deep');$(j.dataset.jump).scrollIntoView({behavior:'smooth'});}
});
$('searchInput').oninput=e=>{state.search=e.target.value;renderNav();};$('levelFilter').onchange=e=>{state.level=e.target.value;renderNav();};
$('bookmarkFilter').onclick=()=>{state.bookmarks=!state.bookmarks;$('bookmarkFilter').classList.toggle('active',state.bookmarks);$('bookmarkFilter').setAttribute('aria-pressed',String(state.bookmarks));renderNav();};
$('starLesson').onclick=()=>{if(state.stars.has(state.lesson))state.stars.delete(state.lesson);else state.stars.add(state.lesson);persist();$('starLesson').classList.toggle('active',state.stars.has(state.lesson));$('starLesson').setAttribute('aria-pressed',String(state.stars.has(state.lesson)));renderNav();toast(state.stars.has(state.lesson)?'Idea bookmarked.':'Bookmark removed.');};
function updateLanguage(){document.body.classList.toggle('no-gu',!state.gu);$('languageButton').classList.toggle('enabled',state.gu);$('languageButton').setAttribute('aria-pressed',String(state.gu));$('guNote').hidden=!state.gu||state.depth!=='deep';}
$('languageButton').onclick=()=>{state.gu=!state.gu;updateLanguage();persist();};
$('markRead').onclick=()=>{if(state.read.has(state.lesson))state.read.delete(state.lesson);else state.read.add(state.lesson);updateReadButton();renderNav();persist();};
$('prevLesson').onclick=()=>{const i=lessons.findIndex(l=>l.id===state.lesson);if(i>0)navigate(lessons[i-1].id);};
$('nextLesson').onclick=()=>{const i=lessons.findIndex(l=>l.id===state.lesson);if(i<lessons.length-1)navigate(lessons[i+1].id);};
$('mobileMenu').onclick=()=>setMobile(!$('sidebar').classList.contains('open'));$('mobileShade').onclick=()=>setMobile(false);
$('chapterButton').onclick=()=>showChart();$('backToMap').onclick=()=>showChart();
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMobile(false);});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id==='chapter'||!id)showChart();else if(lessons.some(l=>l.id===id)){state.lesson=id;renderLesson(true);}});
function openDialog(title,body){$('dialogContent').innerHTML='<div class="dialog-header"><h2>'+title+'</h2><button class="icon-button" id="closeDialog" aria-label="Close dialog">'+icon('close')+'</button></div><div class="dialog-body">'+body+'</div>';$('closeDialog').onclick=()=>$('infoDialog').close();$('infoDialog').showModal();}
function showWord(key){const w=wordBank[key];if(w)openDialog(w[0],'<p class="word-definition">'+esc(w[1])+'</p>'+(state.gu?'<p class="word-definition-gu">'+esc(w[2])+'</p>':'')+'<p>Return to the lesson and read the sentence with this meaning in mind.</p>');}
$('glossaryButton').onclick=()=>openDialog('Word help · simple definitions',Object.entries(wordBank).map(([k,w])=>'<div class="glossary-item"><b>'+esc(w[0])+'</b><span>'+esc(w[1])+'</span><small class="gu-copy">'+esc(w[2])+'</small></div>').join(''));
function showSources(){
 const rows=lectureFiles.map(([n,p,id])=>'<tr><td><a target="_blank" rel="noopener noreferrer" href="https://chatgpt.com/library?file_id='+id+'&account_id=personal">Lecture '+n+' ↗</a></td><td>'+p+'</td><td>Content matching pending</td></tr>').join('');
 openDialog('Sources, review & model scope','<div class="source-status"><strong>'+lessons.length+' independently written lessons reviewed</strong><p>Theory, examples, Gujarati supporting explanations and curated molecular graphs have been reviewed. Review reduces errors; it does not guarantee exhaustive examination coverage or correctness for arbitrary structures.</p></div>'+
 '<h3>What was checked and improved</h3><p>Formula conservation, ordinary valence, tetrahedral geometry, fixed R/S under camera rotation, meso mirror symmetry, E/Z arrangement, bond rotation, Fischer reference orientation, Re/Si viewing sides, chair-flip up/down preservation, and explicit/implicit hydrogen consistency are covered by focused checks. The chapter hierarchy includes each concept once.</p>'+
 '<h3>What the models represent</h3><p>These are idealised teaching geometries with approximate bond dimensions, not measured or energy-optimised structures. Energy curves are qualitative. The viewer does not assign unrestricted CIP descriptors or predict real reaction products. Advanced topics sometimes use a labelled reference model rather than the advanced molecule itself.</p>'+
 '<h3>Primary references</h3><p><a href="https://goldbook.iupac.org/terms/view/S05983" target="_blank" rel="noopener noreferrer">IUPAC Gold Book</a> · <a href="https://iupac.qmul.ac.uk/BlueBook/P9.html" target="_blank" rel="noopener noreferrer">IUPAC Blue Book P-9</a> · <a href="https://iupac.qmul.ac.uk/drawing/stereo.html" target="_blank" rel="noopener noreferrer">IUPAC graphical recommendations</a>. Further topic references appear within lessons.</p>'+
 '<h3>Your 17 lecture PDFs · 639 pages</h3><p>The uploaded pages have not been visually verified because page access failed. Exact lecture-topic mapping, original examples and completeness remain unverified. This app does not claim to reproduce or analyse all 639 source pages.</p><table class="coverage-table"><thead><tr><th>Source</th><th>Pages</th><th>Verification</th></tr></thead><tbody>'+rows+'</tbody></table>'+
 '<h3>Your progress</h3><p>Understanding marks, bookmarks, last section, reading depth and Gujarati preference are saved in this browser when local storage is available. They are not synchronised across devices.</p>');
}
$('sourcesButton').onclick=showSources;$('coverageInline').onclick=showSources;
$('infoDialog').addEventListener('click',e=>{if(e.target===$('infoDialog')){const r=$('infoDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('infoDialog').close();}});
const initialView=state.view;updateLanguage();renderLesson(false);if(initialView==='chart')showChart(false);



</script>
</body></html>
